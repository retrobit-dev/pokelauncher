name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper jar is committed, so ./gradlew works without a system Gradle.
      - name: Compile and run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug testDebugUnitTest 2>&1 | tee build.log

      # Raw job logs live on a blob host that some networks cannot reach, so the
      # compiler output is also emitted as workflow annotations (readable via
      # the REST API) and uploaded as an artifact.
      - name: Report compiler errors as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import pathlib, re, glob, os

          def ann(kind, message, path=".github", line=1):
              clean = str(message).replace("::", ":").replace("%", "%25").replace("\r", "")
              print(f"::{kind} file={path},line={line},title=build::{clean}"[:900])

          log_path = pathlib.Path("build.log")
          if not log_path.exists():
              ann("error", "build.log missing")
              raise SystemExit(0)
          lines = log_path.read_text(errors="replace").splitlines()

          # 1. every aapt2 / kotlin line, plus its surrounding context
          hits = [i for i, l in enumerate(lines)
                  if re.search(r"error:|e: file://|FAILURE:|What went wrong", l)]
          for i in hits[:8]:
              for j in range(max(0, i - 4), min(len(lines), i + 3)):
                  tag = ">>" if j == i else "  "
                  ann("error", f"{tag} {lines[j].strip()}", line=j + 1)

          # 2. dump the merged values files around the line aapt2 complains about
          for pattern in ("**/merged_res/**/values*.xml", "**/packaged_res/**/values*.xml",
                          "**/mergeDebugResources/**/values*.xml"):
              for path in glob.glob(f"app/build/{pattern}", recursive=True)[:3]:
                  try:
                      content = pathlib.Path(path).read_text(errors="replace").splitlines()
                  except OSError:
                      continue
                  ann("notice", f"{path}: {len(content)} lines")
                  for i, line in enumerate(content):
                      if "?" in line and ("attr" in line or "<item" in line):
                          for j in range(max(0, i - 3), min(len(content), i + 3)):
                              ann("error", f"{os.path.basename(path)}:{j+1}: {content[j].strip()}", line=j + 1)

          # 3. show which files the merger saw
          seen = sorted(glob.glob("app/build/**/mergeDebugResources/**", recursive=True))
          ann("notice", f"merge dir entries: {len(seen)}; e.g. " + ", ".join(os.path.basename(p) for p in seen[:12]))
          EOF

      - name: Upload compiled resource dump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resources-failure
          path: |
            app/build/intermediates/incremental/debug/mergeDebugResources/**
            app/build/intermediates/merged_res/debug/**
            app/build/intermediates/packaged_res/debug/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pokelauncher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
