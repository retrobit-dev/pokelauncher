name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper jar is committed, so ./gradlew works without a system Gradle.
      - name: Compile and run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug testDebugUnitTest 2>&1 | tee build.log

      # Raw job logs live on a blob host that some networks cannot reach, so the
      # compiler output is also emitted as workflow annotations (readable via
      # the REST API) and uploaded as an artifact.
      - name: Report compiler errors as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import pathlib, re

          log = pathlib.Path("build.log").read_text(errors="replace").splitlines()
          issues = []
          for line in log:
              match = re.match(r"e: file:///(.*?):(\d+):(\d+) (.*)", line)
              if match:
                  issues.append((match.group(1), match.group(2), match.group(3), match.group(4)))
                  continue
              stripped = line.strip()
              if stripped.startswith("e: ") or "error:" in stripped.lower() or "FAILURE:" in stripped:
                  issues.append(("", "1", "1", stripped))

          for path, line, col, message in issues[:40]:
              clean = message.replace("::", ":").replace("%", "%25")
              location = f"file={path},line={line},col={col}," if path else ""
              print(f"::error {location}title=build::{clean}")
          print(f"::notice::parsed {len(issues)} compiler issue(s)")
          EOF

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pokelauncher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
