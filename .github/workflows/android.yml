name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper jar is committed, so ./gradlew works without a system Gradle.
      - name: Compile and run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug testDebugUnitTest 2>&1 | tee build.log

      # Raw job logs live on a blob host that some networks cannot reach, so the
      # compiler output is also emitted as workflow annotations (readable via
      # the REST API) and uploaded as an artifact.
      - name: Report compiler errors as annotations
        if: always()
        run: |
          python3 - <<'EOF'
          """Turn the parts of the Gradle log we need into workflow annotations.

          Raw job logs are hosted on a blob domain that some networks cannot
          reach, so the relevant lines are re-emitted here. Annotations are
          limited to ~1 KB of message text per run, so the log is filtered
          down to the lines a human actually needs.
          """
          import pathlib, re

          def ann(kind, message):
              clean = str(message).replace("::", ":").replace("%", "%25").replace("\r", "")
              print(f"::{kind} title=build::{clean}"[:900])

          log = pathlib.Path("build.log")
          if not log.exists():
              ann("error", "build.log missing")
              raise SystemExit(0)
          log_text = log.read_text(errors="replace")
          lines = [l.rstrip() for l in log_text.splitlines()]

          # the exact lines aapt2 complains about, straight from the merged files
          import glob, os
          for path in sorted(glob.glob(
                  "app/build/intermediates/**/merged.dir/values*/values*.xml", recursive=True)):
              try:
                  content = pathlib.Path(path).read_text(errors="replace").splitlines()
              except OSError:
                  continue
              for i, line in enumerate(content):
                  if "??" in line or "attr/" in line:
                      ann("error", f"{os.path.relpath(path)}:{i+1}: {line.strip()[:180]}")

          if "BUILD SUCCESSFUL" in log_text:
              ann("notice", "BUILD SUCCESSFUL")

          patterns = {
              "error": r"error:|e: file://|FAILED|Exception|Caused by|failed to",
              "warning": r"^(w:|warning:)|: warning:|Deprecated",
              "notice": r"^> Task :app:(assemble|compile|test)|BUILD ",
          }
          for kind, pattern in patterns.items():
              seen = set()
              for line in lines:
                  stripped = line.strip()
                  if not re.search(pattern, stripped):
                      continue
                  if stripped in seen:
                      continue
                  seen.add(stripped)
                  ann(kind, stripped)
                  if len(seen) >= (18 if kind == "error" else 10):
                      break
          EOF

      - name: Summarise failure
        if: failure()
        run: |
          {
            echo '### Build failed'
            echo
            echo '```'
            grep -nE "error:|e: file:|FAILED|What went wrong|Caused by|> Task" build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compiled resource dump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resources-failure
          path: |
            app/build/intermediates/incremental/debug/mergeDebugResources/**
            app/build/intermediates/merged_res/debug/**
            app/build/intermediates/packaged_res/debug/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pokelauncher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
